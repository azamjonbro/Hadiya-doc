# admin.qollanma.techinfo.uz — admin SPA, single-origin like the main host.
#
# Install as its own file, exactly like nginx.conf; do not merge the two and
# do not touch the six unrelated sites already served by this nginx:
#
#   /etc/nginx/sites-available/admin.qollanma.techinfo.uz
#   ln -s ../sites-available/admin.qollanma.techinfo.uz /etc/nginx/sites-enabled/
#   certbot --nginx -d admin.qollanma.techinfo.uz
#   nginx -t && systemctl reload nginx
#
# Why this host proxies /api itself instead of pointing the admin bundle at
# https://qollanma.techinfo.uz/api/v1: that would make every admin call
# cross-ORIGIN (same-site, but a different origin), which means a CORS
# preflight on each request and an extra entry in ALLOWED_ORIGINS. Proxying
# to the same 127.0.0.1:4000 backend from this server block keeps the admin
# app same-origin too, so neither CORS nor SameSite is ever involved.
#
# The refresh cookie is issued with Domain=qollanma.techinfo.uz
# (backend/src/utils/cookies.js sets it from COOKIE_DOMAIN), and an explicit
# Domain attribute covers subdomains — so this host receives it without
# widening COOKIE_DOMAIN. Do NOT widen it to .techinfo.uz: that would hand
# the refresh cookie to the six unrelated sites on this box.
#
# DNS: add an A record for admin.qollanma.techinfo.uz -> 94.241.173.19
# BEFORE running certbot, or the challenge fails.

server {
    listen 80;
    listen [::]:80;
    server_name admin.qollanma.techinfo.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.qollanma.techinfo.uz;

    ssl_certificate     /etc/letsencrypt/live/admin.qollanma.techinfo.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.qollanma.techinfo.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Admins are the ones uploading course videos, so the headroom matters
    # more here than on the employee host.
    client_max_body_size 512m;

    root /var/www/qollanma/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # --- Realtime (socket.io) ---
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7d;
    }

    # --- tus resumable video upload ---
    location /api/v1/videos/upload {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_http_version 1.1;
    }

    # --- HLS video streaming ---
    location /api/v1/video-stream/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_buffering off;
    }

    # --- REST API ---
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
