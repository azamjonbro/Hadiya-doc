# qollanma.techinfo.uz — the API host.
#
# Same backend process the two SPA hosts proxy to; this one exposes it under
# its own name. It serves no SPA: a request to / answers with the health JSON
# rather than a 404 page, so the host is obviously "the API" when opened in a
# browser.
server {
    listen 80;
    listen [::]:80;
    server_name qollanma.techinfo.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qollanma.techinfo.uz;

    ssl_certificate     /etc/letsencrypt/live/qollanma.techinfo.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qollanma.techinfo.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 120m;

    location = / {
        return 302 /api/v1/health;
    }

    # Images bucket only, read-only, prefix stripped: these objects are
    # anonymous-readable, so they are served as plain files.
    location /media/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:9000/;
        proxy_set_header Host $host;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Presigned object URLs (course materials, chat attachments). A SigV4
    # signature covers the host and the path, so the URI has to reach MinIO
    # exactly as it was signed: proxy_pass carries no URI part (no prefix
    # rewriting, unlike /media/ above) and the original Host is passed
    # through. This does not make the buckets public — they stay
    # anonymous-denied, so without a live signature MinIO answers
    # AccessDenied, and the API only hands out signatures that expire in
    # MATERIAL_DOWNLOAD_URL_TTL / CHAT_ATTACHMENT_URL_TTL seconds.
    # Requires S3_SIGNING_ENDPOINT=https://qollanma.techinfo.uz in the
    # backend env; without it the API signs links for 127.0.0.1:9000.
    location ~ ^/(lms-materials|lms-chat)/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
