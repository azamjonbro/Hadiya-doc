# spring.techinfo.uz — employee site (front/dist)
#
# The API is proxied on this same host at /api and /socket.io, so the browser
# never makes a cross-site request: the refresh cookie stays SameSite=Strict
# and there is no CORS preflight. qollanma.techinfo.uz still serves the same
# backend directly for anything that wants to call the API by its own name.
server {
    listen 80;
    listen [::]:80;
    server_name spring.techinfo.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name spring.techinfo.uz;

    ssl_certificate     /etc/letsencrypt/live/spring.techinfo.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spring.techinfo.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/spring/front;
    index index.html;

    # Video uploads go through tus in 5 MB chunks, but a material or an image
    # arrives as one request.
    client_max_body_size 120m;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Hashed filenames — safe to cache forever.
    # A location that declares any add_header drops every inherited one, so the
    # three security headers above have to be repeated here and below.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # index.html must never be cached, or a deploy leaves clients on an old
    # bundle pointing at asset files that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
