# qollanma.techinfo.uz — single-origin deployment.
#
# This box is a SHARED server: nginx here already serves algoritm/dacha/
# oil/ops/prava/soat .techinfo.uz, and Node processes under /root/apps and
# /root/OPS hold ports 3912, 5000, 7766, 7779, 4100, 4099. This file is a
# standalone site config — install it as its own file and leave every other
# site untouched:
#
#   /etc/nginx/sites-available/qollanma.techinfo.uz
#   ln -s ../sites-available/qollanma.techinfo.uz /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Front and API share one origin on purpose. The refresh cookie is
# SameSite=Strict (backend/src/utils/cookies.js); serving the SPA and the
# API from the same host keeps every request same-site, so the cookie is
# always attached and no CORS preflight is involved at all.

server {
    listen 80;
    listen [::]:80;
    server_name qollanma.techinfo.uz;

    # certbot writes its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name qollanma.techinfo.uz;

    ssl_certificate     /etc/letsencrypt/live/qollanma.techinfo.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qollanma.techinfo.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Video originals are large; the app's tus chunking keeps any single
    # request well under this, but PATCH bodies need the headroom.
    client_max_body_size 512m;

    # --- Employee SPA (front/dist) ---
    root /var/www/qollanma/front;
    index index.html;

    location / {
        # Vue Router history mode: a deep link or a refresh on /courses/:id
        # asks for a file that does not exist. Without this fallback nginx
        # answers a real 404 and the app never boots.
        try_files $uri $uri/ /index.html;
    }

    # Hashed bundles are content-addressed and safe to pin forever;
    # index.html must never be cached or a deploy goes unnoticed.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # --- Realtime (socket.io) ---
    # The client connects at the ORIGIN ROOT, not under /api — see
    # front/src/services/socket.js, which strips the /api/v1 suffix off
    # VITE_API_BASE_URL. Without this block chat, presence and the
    # notification badge fail silently while the rest of the app works.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7d;
    }

    # --- tus resumable video upload ---
    location /api/v1/videos/upload {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream the upload body straight through instead of buffering the
        # whole 8MB chunk to disk first.
        proxy_request_buffering off;
        proxy_http_version 1.1;
    }

    # --- HLS video streaming ---
    location /api/v1/video-stream/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Range requests (segment seeking) must reach the app untouched.
        proxy_set_header Range $http_range;
        proxy_buffering off;
    }

    # --- REST API ---
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
