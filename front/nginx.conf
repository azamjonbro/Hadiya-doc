server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vue Router uses history mode (createWebHistory) — any path that
    # isn't a real static file falls back to index.html so client-side
    # routing handles it instead of nginx 404ing on a deep link/refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (Vite's default output naming) are safe to cache
    # forever; index.html itself must never be cached, or a deploy won't
    # reach already-open tabs until they hard-refresh.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
