<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Corporate LMS</title>
    <!-- 12.1 — installable. The manifest itself is injected by
         vite-plugin-pwa at build time; these are the parts a browser
         reads before it, and the iOS icon, which iOS takes only from a
         link tag. -->
    <meta name="theme-color" content="#007bff" />
    <meta name="description" content="Kurslar, testlar, sertifikatlar va xodimlar o'quv jarayoni." />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Mavzu Vue mount bo'lishidan oldin qo'yiladi: aks holda sahifa avval
         oq holda chizilib, keyin qorong'iga o'tadi (oqarib ketish effekti). -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('lms-theme')
          var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
  </head>
  <body class="bg-bg font-sans text-ink antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
