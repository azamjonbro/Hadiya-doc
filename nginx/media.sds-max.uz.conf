# INF-2 — a host of its own for stored files (images, presigned material
# and chat downloads). Today these ride on the API host
# (qollanma.sds-max.uz/media/ and /lms-*/); this block moves them without
# touching the API, so the two can later get different Cloudflare cache
# rules and different rate limits, and so a public-file URL never shares
# an origin with the API's cookies.
#
# Apply on the home server (needs sudo — see the steps under INF-2 in
# docs/v3/09-master-checklist.md):
#
#   sudo cp ~/qollanma/nginx/media.sds-max.uz.conf /etc/nginx/sites-available/media.sds-max.uz
#   sudo ln -s /etc/nginx/sites-available/media.sds-max.uz /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then add the public hostname in Cloudflare Zero Trust (the tunnel is
# token-managed, its ingress lives in the dashboard, not in a file here):
#   media.sds-max.uz  ->  http://localhost:80
# and point the backend at it in ~/qollanma/backend/.env:
#   S3_SIGNING_ENDPOINT=https://media.sds-max.uz
#   S3_PUBLIC_URL=https://media.sds-max.uz/lms-images
# then `pm2 reload qollanma`, `pm2 reload qollanma-worker`, and prove it:
#   cd ~/qollanma/backend && npm run check:signing
#
# Keep the old /media/ and /lms-*/ locations on qollanma.sds-max.uz:
# image URLs already stored in the database are absolute and still
# point there.

server {
    listen 80;
    listen [::]:80;

    server_name media.sds-max.uz;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/media.access.log;
    error_log  /var/log/nginx/media.error.log;

    # Nothing but stored objects lives here. The root answers 404 on
    # purpose: there is no page, and a redirect to the app would make the
    # host look like something it is not.
    location = / {
        return 404;
    }

    # Public images (course covers, avatars, news). Immutable in practice —
    # every upload gets a fresh UUID key — so a month at the edge is safe,
    # and Cloudflare caches image extensions on its own.
    location /lms-images/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Presigned downloads: materials (every download button, audio
    # playback) and chat attachments. The signature covers the Host
    # header, so it must reach MinIO unchanged and S3_SIGNING_ENDPOINT
    # must name this host. No Cache-Control: the URL carries a per-user,
    # expiring signature and a cached copy would outlive it.
    location ~ ^/(lms-materials|lms-chat)/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Every other bucket (originals, processed HLS, faces, SCORM) is
    # private and reached only through the API.
    location / {
        return 404;
    }
}
