# Edge reverse proxy — TLS termination + routing to the two internal
# services (front, backend). Replace `lms.example.com` throughout with the
# real domain before deploying; see docs/deployment.md for the full
# HTTPS/certbot setup this config assumes (one cert covering the apex and
# the `api.` subdomain, mounted read-only into this container at the paths
# below).
#
# The admin panel is not a separate host: it lives inside the employee SPA
# at /bos and is served by the same `front` container.
#
# Spec §33/§34: no wildcard CORS in production (enforced app-side by
# ALLOWED_ORIGINS, not here), HTTPS mandatory (spec §48) — the plain-HTTP
# server block below exists ONLY to redirect to HTTPS, it never serves
# app content.

server {
    listen 80;
    listen [::]:80;
    server_name lms.example.com api.lms.example.com;
    return 301 https://$host$request_uri;
}

# --- Employee app (front/) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lms.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        proxy_pass http://front:80;
        proxy_set_header Host $host;
    }
}

# --- API (backend/) — REST, tus resumable upload, HLS video streaming ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.lms.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # Video originals can be large; the app's own multipart/tus chunking
    # keeps any single request well under this, but it's the ceiling for
    # the resumable-upload PATCH requests specifically.
    client_max_body_size 512m;

    location /api/v1/videos/upload {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # tus PATCH requests stream the upload body straight through to
        # the app rather than buffering the whole chunk on disk first —
        # matters once chunk sizes approach this proxy's default buffer.
        proxy_request_buffering off;
        proxy_http_version 1.1;
    }

    location /api/v1/video-stream/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Range requests (HLS segment seeking) must reach the app
        # untouched — no caching/buffering layer here that could rewrite
        # or strip Range/Content-Range.
        proxy_set_header Range $http_range;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
