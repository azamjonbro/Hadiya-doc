# The SPA host as it runs on the home server, plus the two cache rules the
# live copy is still missing (sw.js, manifest.json). Apply with sudo:
#
#   sudo cp ~/qollanma/nginx/spring.sds-max.uz.conf /etc/nginx/sites-available/spring.sds-max.uz
#   sudo nginx -t && sudo systemctl reload nginx
#
# and purge sw.js once in the Cloudflare dashboard (or wait four hours).
# qollanma / spring-lms frontend (SPA, admin lives at /admin in the same bundle)
server {
    listen 80;
    listen [::]:80;

    server_name spring.sds-max.uz;

    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml text/xml application/xml;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/spring/front;
    index index.html;
    client_max_body_size 120m;

    access_log /var/log/nginx/spring.access.log;
    error_log  /var/log/nginx/spring.error.log;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 12.1 — without this Cloudflare applies its own default (max-age=14400)
    # to the worker, and for four hours after a deploy the edge hands out
    # the *previous* sw.js, whose precache list names assets the new build
    # no longer has; install fails with bad-precaching-response and the app
    # has no offline support at all. Measured in production on 2026-09-10.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
