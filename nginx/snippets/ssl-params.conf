# Shared TLS hardening, included by every server block in reverse-proxy.conf.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;
ssl_prefer_server_ciphers on;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# App-level security headers already come from helmet() on the backend
# and from each SPA's own CSP meta tag where present — these are
# edge-level defense-in-depth, not a substitute.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
